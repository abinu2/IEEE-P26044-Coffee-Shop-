name: Track B Regression Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      live_base_url:
        description: "Optional deployed URL for post-deploy smoke checks"
        required: false
        default: ""

jobs:
  regression:
    name: Lower-environment regression
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Track B regression gate
        run: |
          python -m pytest tests/test_reward_ledger.py tests/test_cart_fulfillment.py tests/regression/test_track_b_regression_agent.py

  post-deploy-smoke:
    name: Optional post-deploy smoke
    runs-on: ubuntu-latest
    needs: regression
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_base_url != '' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Run live smoke check
        run: |
          python scripts/track_b_live_smoke.py "${{ inputs.live_base_url }}"
